name: R package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            serial: false
          - os: macos-latest
            serial: false
          - os: windows-latest
            serial: false
          - os: ubuntu-latest
            serial: true
    runs-on: ${{ matrix.os }}
    env:
      JAVA_HOME: __KALOS_NO_JAVA__
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Fetch the locked OpenBLAS recipe
        uses: actions/checkout@v5
        with:
          repository: statistikat/kalos
          ref: fa7edeae3c68862e163633c7debce3d102248223
          path: .kalos-provider
      - name: Build the pinned LP64 provider
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y gfortran
          else
            brew install gcc
          fi
          python .kalos-provider/tools/build-openblas.py --prefix "$RUNNER_TEMP/openblas" --jobs 2
          echo "KALOS_OPENBLAS_ROOT=$RUNNER_TEMP/openblas" >> "$GITHUB_ENV"
      - name: Set up UCRT build tools for OpenBLAS
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-python
      - name: Build the pinned Windows LP64 provider
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          prefix="$(cygpath -m "$RUNNER_TEMP")/openblas"
          python .kalos-provider/tools/build-openblas.py --prefix "$prefix" --jobs 2
          echo "KALOS_OPENBLAS_ROOT=$prefix" >> "$GITHUB_ENV"
      - name: Compiler mode
        shell: Rscript {0}
        run: |
          makevars <- file.path(Sys.getenv("RUNNER_TEMP"), "kalos-Makevars")
          writeLines(if ("${{ matrix.serial }}" == "true") "SHLIB_OPENMP_CXXFLAGS =" else character(), makevars)
          cat(paste0("R_MAKEVARS_USER=", makevars, "\n"), file=Sys.getenv("GITHUB_ENV"), append=TRUE)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            local::.
            any::tinytest
            any::jsonlite
            any::rcmdcheck
          dependencies: '"hard"'
      - run: python tools/sync-core.py --verify
      - name: Check archive
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args="--no-manual", error_on="error", check_dir="check")
      - name: No Java and thread qualification
        shell: Rscript {0}
        run: |
          library(rkalos, lib.loc=file.path("check", "rkalos.Rcheck"))
          stopifnot(!any(c("rJava", "rjd3toolkit", "rjd3x13", "rjd3tramoseats") %in% loadedNamespaces()))
          provider <- core_version()
          stopifnot(provider$provider == "OpenBLAS", provider$blas_integer_bits == 32L,
                    grepl("0.3.34", provider$provider_version, fixed=TRUE))
          info <- provider$parallel
          if ("${{ matrix.serial }}" == "true") stopifnot(!info$compiled, info$probe_threads == 1L)
          if (Sys.info()[["sysname"]] == "Linux" && "${{ matrix.serial }}" == "false") stopifnot(info$probe_threads > 1L)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-check-${{ matrix.os }}-${{ matrix.serial }}
          path: check
